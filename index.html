<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Código (HTML/CSS/JS/PHP/SQL)</title>
    <style>
        :root {
            --bg-page: #f5f5f7;
            --bg-card: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --border-light: #d2d2d7;
            --accent: #1b5e3f;
            --accent-hover: #123f2a;
            --accent-soft: #e9f5ee;
            --green: #1d9a55;
            --green-soft: #e8f8ee;
            --green-border: #cdeedd;
            --red: #d70015;
            --red-soft: #fdeaec;
            --red-border: #f7d0d4;
            --amber: #b25e00;
            --amber-soft: #fff4e5;
            --amber-border: #ffe2b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 18px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            overflow: hidden;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 32px 34px;
            text-align: center;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .header-logo { height: 48px; width: auto; flex-shrink: 0; }
        .header h1 { font-size: 1.7em; font-weight: 700; letter-spacing: -0.01em; }
        .header p { color: var(--text-secondary); font-size: 1em; margin-top: 8px; }
        .header-badges { margin-top: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .header-badge svg { width: 13px; height: 13px; flex-shrink: 0; }
        .header-badge.html { background: #ffece8; color: #c8391f; }
        .header-badge.php { background: #f1eefb; color: #6b46c1; }
        .header-badge.js { background: #fff8e1; color: #92720b; }
        .header-badge.css { background: #e8f1fd; color: #1d6fd1; }
        .header-badge.sql { background: #e3f7f9; color: #0f7c8c; }
        .main-content { padding: 30px; }
        .input-section { margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label, .section-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary); }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.2s ease;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
        }
        .file-input-wrapper { position: relative; display: inline-block; margin-bottom: 15px; }
        .file-input { opacity: 0; position: absolute; z-index: -1; }
        .file-label {
            display: inline-block;
            padding: 10px 22px;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .file-label:hover { background: #d9ede2; }
        .mode-section {
            margin-bottom: 20px;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }
        .mode-option {
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            user-select: none;
        }
        .mode-option:hover { border-color: var(--accent); }
        .mode-option.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }
        .analyze-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 10px;
        }
        .analyze-btn:hover { background: var(--accent-hover); }
        .minify-btn {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            padding: 12px 26px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 10px;
        }
        .minify-btn:hover { background: var(--accent-soft); }
        .minify-results { margin-top: 30px; display: none; animation: fadeIn 0.4s ease-in; }
        .minify-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 24px;
            background: var(--green-soft);
            border: 1px solid var(--green-border);
            color: #146538;
            padding: 15px 20px;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .minify-stats .highlight { color: var(--green); }
        #minifiedOutput {
            width: 100%;
            min-height: 220px;
            padding: 15px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-family: 'SF Mono', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #fafafa;
            color: var(--text-primary);
            resize: vertical;
        }
        .minify-actions { margin-top: 12px; display: flex; gap: 10px; }
        .copy-btn {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid transparent;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover { background: #d9ede2; }
        .clear-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            padding: 13px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .clear-btn:hover { background: var(--bg-page); }
        .results { margin-top: 30px; display: none; animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-card {
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid;
            font-weight: 600;
            font-size: 1.05em;
        }
        .status-success { background: var(--green-soft); border-color: var(--green-border); color: #146538; }
        .status-error { background: var(--red-soft); border-color: var(--red-border); color: #98000f; }
        .status-warning { background: var(--amber-soft); border-color: var(--amber-border); color: var(--amber); }
        .lang-section {
            margin-top: 25px;
            border: 1px solid var(--border-light);
            border-radius: 14px;
            overflow: hidden;
        }
        .lang-header {
            padding: 14px 20px;
            font-weight: 600;
            font-size: 1.05em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lang-header.ok { background: var(--green-soft); border-bottom: 1px solid var(--green-border); }
        .lang-header.bad { background: var(--red-soft); border-bottom: 1px solid var(--red-border); }
        .lang-header.warn { background: var(--amber-soft); border-bottom: 1px solid var(--amber-border); }
        .lang-body { padding: 20px; background: var(--bg-card); }
        .tags-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 14px;
            margin: 15px 0;
        }
        .tag-card {
            background: var(--bg-page);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }
        .tag-card:hover { border-color: var(--accent); }
        .tag-name { font-size: 1.05em; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .tag-count { font-size: 0.95em; }
        .balanced { color: var(--green); font-weight: 600; }
        .unbalanced { color: var(--red); font-weight: 600; }
        .details-section { margin-top: 18px; background: var(--bg-card); padding: 16px; border-radius: 12px; border: 1px solid var(--border-light); }
        .error-list, .warning-list { list-style: none; padding: 0; }
        .error-item {
            background: var(--red-soft);
            margin: 10px 0;
            padding: 13px 15px;
            border-radius: 8px;
            border: 1px solid var(--red-border);
            color: #98000f;
        }
        .warning-item {
            background: var(--amber-soft);
            margin: 10px 0;
            padding: 13px 15px;
            border-radius: 8px;
            border: 1px solid var(--amber-border);
            color: var(--amber);
        }
        .line-info { font-size: 0.9em; color: var(--text-secondary); margin-top: 4px; }
        code { background: var(--bg-page); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', 'Courier New', monospace; color: var(--text-primary); }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 20px 0;
        }
        .stat-item {
            background: var(--bg-card);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .stat-number { font-size: 1.7em; font-weight: 700; color: var(--accent); display: block; }
        .stat-label { color: var(--text-secondary); font-size: 0.85em; margin-top: 5px; }
        .loading { display: none; text-align: center; padding: 20px; color: var(--accent); }
        .spinner {
            border: 3px solid var(--bg-page);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-lang-note { color: var(--text-secondary); padding: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <img src="logo.png" alt="PCMarkett" class="header-logo">
                <h1>Verificador de Código Multi-Lenguaje</h1>
            </div>
            <p>Analiza estructura de HTML, PHP, JavaScript, CSS3 y SQL con un solo clic</p>
            <div class="header-badges">
                <span class="header-badge html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 4 2 12 8 20"/><polyline points="16 4 22 12 16 20"/></svg>
                    HTML
                </span>
                <span class="header-badge php">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
                    PHP 8.3
                </span>
                <span class="header-badge js">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-8l1-6z"/></svg>
                    JS
                </span>
                <span class="header-badge css">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-4 5-7 9-7 13a7 7 0 0 0 14 0c0-4-3-8-7-13z"/></svg>
                    CSS3
                </span>
                <span class="header-badge sql">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
                    SQL
                </span>
            </div>
        </div>
        <div class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" class="file-input" accept=".html,.htm,.php,.css,.js,.sql,.txt">
                        <label for="fileInput" class="file-label">📁 Cargar archivo</label>
                    </div>
                    <div id="fileName" style="margin-top: 10px; color: #1b5e3f; font-weight: 600;"></div>
                </div>
                <div class="mode-section">
                    <div class="section-label">Tipo de análisis:</div>
                    <div class="mode-grid" id="modeGrid">
                        <div class="mode-option active" data-mode="auto">🧠 Auto-detectar (todo)</div>
                    </div>
                </div>
                <div class="input-group">
                    <label for="codeContent">O pega tu código aquí:</label>
                    <textarea id="codeContent" placeholder="Pega tu código HTML, CSS, JavaScript, PHP o SQL aquí para analizar..."></textarea>
                </div>
                <div class="button-group">
                    <button id="analyzeBtn" class="analyze-btn">🔍 Analizar Código</button>
                    <button id="minifyBtn" class="minify-btn">🗜️ Minificar</button>
                    <button id="clearBtn" class="clear-btn">🗑️ Limpiar</button>
                </div>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analizando código...</p>
            </div>
            <div class="results" id="results">
                <div id="overallStatus"></div>
                <div class="stats-summary" id="statsSummary"></div>
                <div id="languageSections"></div>
            </div>
            <div class="minify-results" id="minifyResults">
                <div class="minify-stats" id="minifyStats"></div>
                <textarea id="minifiedOutput" readonly></textarea>
                <div class="minify-actions">
                    <button id="copyMinBtn" class="copy-btn">📋 Copiar</button>
                    <button id="downloadMinBtn" class="copy-btn">⬇️ Descargar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
